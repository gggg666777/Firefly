# Sveltia CMS 配置
# 文档：https://sveltiacms.app/zh/docs/

backend:
  name: github
  repo: gggg666777/Firefly
  branch: master
  # GitHub OAuth 代理（部署后替换成真实地址）
  base_url: https://sveltia-auth.ysnb.store

# 站点语言
locale: zh_Hans

# 图片存放位置
media_folder: public/assets/uploads
public_folder: /assets/uploads

# 提交信息模板
commit_messages:
  create: 'cms: 新建 %{collection}「%{slug}」'
  update: 'cms: 更新 %{collection}「%{slug}」'
  delete: 'cms: 删除 %{collection}「%{slug}」'
  uploadMedia: 'cms: 上传图片 %{path}'
  deleteMedia: 'cms: 删除图片 %{path}'

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}  ·  {{published}}'
    sortable_fields: [published, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - {
          label: 发布日期,
          name: published,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - { label: 摘要, name: description, widget: text, required: false, hint: 显示在首页卡片上 }
      - { label: 封面图, name: image, widget: image, required: false }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - { label: 分类, name: category, widget: string, required: false }
      - { label: 草稿, name: draft, widget: boolean, default: false, hint: 打开后不会公开 }
      - { label: 语言, name: lang, widget: string, required: false, default: '' }
      - { label: 固定链接, name: slug, widget: string, required: false, hint: 留空则自动生成 }
      - { label: 正文, name: body, widget: markdown }

  - name: dynamic
    label: 动态
    label_singular: 动态
    folder: src/content/dynamic
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}'
    extension: md
    format: frontmatter
    summary: '{{published}}  ·  {{body}}'
    sortable_fields: [published]
    fields:
      - {
          label: 发布时间,
          name: published,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: 'HH:mm:ss',
          picker_utc: false,
        }
      - { label: 置顶, name: pinned, widget: boolean, default: false }
      - { label: 位置, name: location, widget: string, required: false, hint: 可留空 }
      - { label: 内容, name: body, widget: markdown }

  - name: settings
    label: 站点设置
    files:
      - name: announcement
        label: 公告
        file: src/data/announcement.json
        fields:
          - { label: 显示公告, name: enable, widget: boolean, default: true, hint: 关掉后侧边栏不显示 }
          - { label: 标题, name: title, widget: string, required: false, hint: 留空则显示「公告」 }
          - { label: 内容, name: content, widget: text }
          - { label: 允许访客关闭, name: closable, widget: boolean, default: true }
          - label: 底部链接
            name: link
            widget: object
            fields:
              - { label: 启用链接, name: enable, widget: boolean, default: false }
              - { label: 按钮文字, name: text, widget: string, required: false }
              - { label: 链接地址, name: url, widget: string, required: false }
              - { label: 在新窗口打开, name: external, widget: boolean, default: false }
